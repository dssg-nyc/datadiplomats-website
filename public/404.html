<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Data Diplomats for Nonprofits</title>
    <script>
      // GitHub Pages serves this page (status 404) for any path it does not
      // know, such as a deep link to /workshops. Send the visitor to
      // /?/workshops; the script in index.html restores the clean URL before
      // the React app boots. Pattern: https://github.com/rafgraph/spa-github-pages
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
