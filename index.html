    <script>
      // Single-page-app routing on GitHub Pages. Two jobs:
      // 1. A visitor sent here by 404.html (deep link such as /workshops)
      //    arrives as /?/workshops; restore the real path before React reads it.
      // 2. Old hash links (/#/workshops) redirect to the clean path.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          return;
        }
        if (l.hash.indexOf('#/') === 0) {
          l.replace(l.pathname.replace(/\/$/, '') + l.search + l.hash.slice(1));
        }
      })();
    </script>

    <!-- Google Ads conversion tracking. The Google tag itself loads only

        if (/forms\.gle|docs\.google\.com\/forms/.test(link.href)) {
          window.gtag('event', 'conversion', {
            send_to: 'AW-18527015092/Qx8ICPnR27MdELShr4JF',
          });
        }
      });
