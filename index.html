<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="images/nyc_landing.jpg" />
    <title>Data Diplomats Program</title>
    <meta name="description" content="A leadership and human-centered AI program for people who want to build something for their community. Open to all career backgrounds." />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
    <!-- Google Ads conversion tracking. The Google tag itself loads only
         after the visitor grants analytics or advertising cookies
         (src/consent/consent.js, tag id from VITE_GOOGLE_TAG_ID at build
         time). This listener fires the Apply conversion when a visitor
         clicks through to the application or volunteer Google Form; events
         queue in dataLayer until the consent-gated tag loads. -->
    <script>
      document.addEventListener('click', function (event) {
        var link = event.target.closest && event.target.closest('a[href]');
        if (!link || typeof window.gtag !== 'function') return;
        if (/forms\.gle|docs\.google\.com\/forms/.test(link.href)) {
          window.gtag('event', 'conversion', {
            send_to: 'AW-18527015092/Qx8ICPnR27MdELShr4JF',
          });
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
