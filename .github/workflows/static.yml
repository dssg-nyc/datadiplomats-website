# Build the Vite app and deploy dist/ to GitHub Pages.
# Uploading the repo root serves raw .jsx, which Chrome rejects (MIME type text/jsx).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_TAG_ID: AW-18527015092
          # GA4 web property "Data Diplomats" for www.datadiplomats.org.
          # Not a secret: the ID ships in the built page source, same as the
          # Ads tag above. Analytics still runs only for consenting visitors.
          VITE_GA_MEASUREMENT_ID: G-BVKW3V2GJ9

      - name: Add CNAME to dist
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
